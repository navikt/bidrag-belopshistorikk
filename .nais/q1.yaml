name: bidrag-belopshistorikk-q1
ingresses:
  - https://bidrag-belopshistorikk-q1.intern.dev.nav.no
dbname: bidrag-belopshistorikk-q1
kafka:
  pool: nav-dev
kafka-topic-vedtak: bidrag.vedtak-q1
spring-profiles: live,nais
azureAccessInbound:
  - application: bidrag-behandling-q1
    namespace: bidrag
    cluster: dev-gcp
  - application: bisys
    namespace: bidrag
    cluster: dev-fss
  - application: bidrag-automatisk-jobb-q1
    namespace: bidrag
    cluster: dev-gcp
env:
  PERSON_URL: https://bidrag-person-q1.dev-fss-pub.nais.io/bidrag-person
  PERSON_SCOPE: dev-fss.bidrag.bidrag-person-q1
access-outbound:
  PERSON_URL: bidrag-person-q1.dev-fss-pub.nais.io
spec:
  replicas:
    min: 1
    max: 1
  resources:
    limits:
      memory: 2048Mi
    requests:
      cpu: 270m
      memory: 512Mi
  gcp:
    sqlInstances:
      tier: db-custom-1-3840
      diskAutoresize: false